name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Linux packages for the desktop app (webview, tray, hotkeys, microphone)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: UI script parses
        if: runner.os == 'Linux'
        run: |
          node --check apps/desktop/ui/icons.js
          node --check apps/desktop/ui/app.js

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build the desktop app and the CLI
        run: cargo build --workspace --release

      - name: Scenario walk-through with the CLI
        shell: bash
        run: |
          export FASTMIND_CONFIG="$RUNNER_TEMP/fastmind/settings.json"
          bin=target/release/fastmind
          # FastMind needs an AI: without one, it refuses and says how to set one up.
          if $bin demo "$RUNNER_TEMP/fastmind/demo" 2> refused.txt; then
            echo "FastMind ran without an AI provider"; exit 1
          fi
          grep -q "needs an AI provider" refused.txt
          # A stand-in AI: an OpenAI-compatible server on localhost (see .github/fake-model.py).
          py=$(command -v python3 || command -v python)
          "$py" .github/fake-model.py 8099 &
          # Wait until it listens: a fixed sleep lost the race on a slow Windows runner.
          "$py" -c "import socket, time
          for _ in range(60):
              try: socket.create_connection(('127.0.0.1', 8099), 1).close(); break
              except OSError: time.sleep(0.5)
          else: raise SystemExit('the stand-in AI never started')"
          $bin model local stub --url http://127.0.0.1:8099/v1
          $bin demo "$RUNNER_TEMP/fastmind/demo"
          $bin capture "Cross-platform capture from $RUNNER_OS #ci"
          $bin search "cross-platform capture"
          $bin ask "what does a failing liveness probe do?"
          $bin dream
          $bin dream apply all
          $bin status
          $bin archive
          $bin history

      - uses: actions/upload-artifact@v4
        with:
          name: fastmind-${{ runner.os }}
          path: |
            target/release/fastmind
            target/release/fastmind.exe
            target/release/fastmind-desktop
            target/release/fastmind-desktop.exe
            apps/desktop/ui
          if-no-files-found: ignore
          retention-days: 14
