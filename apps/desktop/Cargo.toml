[package]
name = "fastmind-desktop"
description = "FastMind: one app in the tray that captures, remembers and dreams."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fastmind-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fastmind-core.workspace = true
serde_json.workspace = true
chrono.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
opener = "0.7"
# Voice capture: the microphone, and the speech model (downloaded once, checked, unpacked).
cpal = "0.15"
sha2 = "0.10"
sherpa-onnx = "2.0.1"
bzip2 = "0.6"
tar = "0.4"
ureq.workspace = true
directories.workspace = true

# Global hotkeys under Wayland go through the desktop's shortcuts service (the XDG portal).
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", default-features = false, features = ["sync"] }
# Tauri's Linux tray (libappindicator) only shows a menu: a left click never reaches the app.
# The ksni backend speaks StatusNotifierItem directly, so a click opens FastMind as elsewhere.
# Not used in code: enabling the feature here switches the tray-icon crate Tauri builds on.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

[dev-dependencies]
tempfile.workspace = true
